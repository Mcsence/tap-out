# Mise en ligne sur Render (offre gratuite) : Render lit ce fichier et configure le service tout seul.
services:
  - type: web
    name: tap-out
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
